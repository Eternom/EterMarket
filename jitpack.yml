# Build JitPack (https://jitpack.io/#Eternom/EterMarket)
# Gradle tourne sur Java 21 ; le JDK 25 demandé par le projet (toolchain) est téléchargé
# automatiquement grâce au plugin foojay déclaré dans settings.gradle.kts.
# Gradle est téléchargé directement depuis gradle.org et décompressé DANS le dossier du build : dans /tmp, partagé
# entre builds, il arrivait incomplet (ClassNotFoundException: org.gradle.instrumentation.agent.Agent). L'agent est
# aussi extrait dans le dossier utilisateur de Gradle (~/.gradle, partagé) : d'où GRADLE_USER_HOME dans le build (1.9.0 ratée).
# Java 21 installé et désigné par nous : le choix automatique de JitPack (jdk: openjdk21) a échoué au téléchargement
# (1.10.0 ratée) ; JAVA_HOME est donc donné explicitement à Gradle.
# En cas d'échec, republier sous une nouvelle version (JitPack garde l'échec d'un tag).
jdk:
  - openjdk21
before_install:
  - sdk install java 21.0.2-open || true
  # L'archive arrive parfois abîmée chez JitPack (jars illisibles : 1.10.0 à 1.10.2 ratées) : vérifiée par son SHA-256,
  # retéléchargée sinon
  - for i in 1 2 3 4 5; do curl -fsSL -o gradle-dist.zip https://services.gradle.org/distributions/gradle-9.7.1-bin.zip && echo "acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a  gradle-dist.zip" | sha256sum -c - && break; echo "archive de Gradle abimee, nouvel essai"; sleep 5; done
  # Décompressée dans un dossier unique (/tmp/eter-gradle.XXXXXX) : deux builds en même temps chez JitPack s'écrasaient
  #   le même dossier (jars illisibles, agent introuvable)
  - D=$(mktemp -d /tmp/eter-gradle.XXXXXX) && unzip -q gradle-dist.zip -d "$D" && echo "$D" > .eter-gradle-dir
install:
  - D=$(cat .eter-gradle-dir); for i in 1 2 3; do JAVA_HOME="$HOME/.sdkman/candidates/java/21.0.2-open" GRADLE_USER_HOME="$D/home" "$D/gradle-9.7.1/bin/gradle" publishToMavenLocal --no-daemon && break; echo "build rate, nouvel essai"; done
