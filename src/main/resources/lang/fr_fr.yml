  usage: '<error>Utilisation : <accent>/market \<create|place|remove|edit|delete|list|reload|jobs> [pnj]'
  invalid-id: "<error>Identifiant invalide : minuscules, chiffres, _ et - (32 caractères max)."
  exists: "<error>Le PNJ <accent><npc></accent> existe déjà."
  unknown: "<error>PNJ inconnu : <accent><npc></accent>."
