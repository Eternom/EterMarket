    label: "Lots"
    confirm: "Buy"
  bought: "<info>Bought <accent><amount></accent> item(s) for <accent><price></accent>."
  no-space: "<error>Not enough room in your inventory."
  no-stock: "<error>Not enough stock left for this purchase."
  not-enough: "<error>You need <accent><price></accent> for this purchase."

editor:
  title: "<dark_red>Editor · <npc>"
  save: "Save"
  hold-item: "<error>Hold the item to sell (with the quantity of one lot)."
  added: "<info>Item added to the shop for <accent><price></accent>."
