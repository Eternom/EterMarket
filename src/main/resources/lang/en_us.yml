  item:
    arbitrage: "<error>⚠ Sold <price>/unit, not more than a quest pays (<reward>/unit): people will buy to deliver!"
    stock: "<dark_gray>▸ <info>Shared stock: <accent><amount>"
    not-stockable: "<dark_gray>▸ <info>Custom item: never in stock, always unlimited"
