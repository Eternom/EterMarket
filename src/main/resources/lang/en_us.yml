# EterMarket messages, MiniMessage format: https://docs.advntr.dev/minimessage/format
# Palette tags (EterLib/config.yml > language.colors): <primary> <accent> <info> <error> <success>
#   <info> = normal light gray text, <accent> = important words in orange.
# Values between <> such as <npc> are filled in by the plugin. To show a literal "<", write \< inside 'single quotes'.
# A missing key falls back to the plugin's built-in text: you only need to keep the lines you change.
# The message prefix ("Core") is shared by all plugins: EterLib/config.yml > language.prefix.
# Shared texts ("Cancel", "Unknown player", "players only"...): in EterLib/lang/, for every plugin.

npc:
  role:
    shop: "<info>Shop"
    job: "<info>Guild: <job>"
    auction: "<info>Auction house"
  create-usage: '<error>Usage: <accent>/market create \<npc></accent> (shop), <accent>/market create \<npc> job \<job></accent> (<jobs>) or <accent>/market create \<npc> auction</accent> (auction house)'
  usage: '<error>Usage: <accent>/market \<create|place|remove|edit|delete|list|reload|jobs> [npc]'
  invalid-id: "<error>Invalid id: lowercase letters, digits, _ and - (32 characters max)."
  exists: "<error>NPC <accent><npc></accent> already exists."
  unknown: "<error>Unknown NPC: <accent><npc></accent>."
  created: "<info>NPC <accent><npc></accent> created. Place it with <accent>/market place <npc></accent>, fill it with <accent>/market edit <npc></accent>."
  placed: "<info>NPC <accent><npc></accent> placed here."
  removed: "<info>Placement of NPC <accent><npc></accent> removed (its other placements stay)."
  none-near: "<error>No NPC within <accent><radius></accent> blocks."
  deleted: "<info>NPC <accent><npc></accent> deleted, with all its placements and its shop."
  delete-usage: '<error>Deletes the NPC everywhere, with its shop: <accent>/market delete \<npc> confirm'
  list: "<info>NPCs: <accent><npcs>"
  list-empty: "<info>No NPC. Create one with <accent>/market create \\<npc></accent>."
  reloaded: "<info>NPCs reloaded."

