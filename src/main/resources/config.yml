# ============================================================
#  EterMarket
# ============================================================
#
#  Les PNJ, le contenu des boutiques, le répertoire des quêtes et le stock commun
#  sont en base (communs à tout le réseau) et se gèrent en jeu :
#    /market create <pnj>               crée une boutique (une seule fois pour tout le réseau)
#    /market create <pnj> job <métier>  crée le PNJ de référence d'un métier (quêtes + boutique du métier)
#    /market create <pnj> auction       crée un PNJ hôtel des ventes
#    /market place <pnj>                le place là où tu es (autant de fois que tu veux)
#    /market remove                     retire le PNJ le plus proche
#    /market edit <pnj>                 ouvre l'éditeur (aussi : Maj + clic droit sur le PNJ)
#  Les textes sont dans lang/. Toute modification nécessite un redémarrage du serveur.

# Guilde des métiers : chaque joueur a UN métier, et reçoit chaque jour des quêtes au PNJ de
# son métier : objets à livrer (parfois plusieurs, en commande) et actions à faire (tuer,
# casser, pêcher). Les objets livrés vont dans le stock commun, la récompense est le
# principal revenu du serveur (voir « Repères économiques » d'EterEconomy).
# Le répertoire des quêtes se gère en jeu ; /market jobs reset <métier> confirm le remet à
# celui de départ.
jobs:
  # Les quêtes changent à minuit dans ce fuseau.
  time-zone: Europe/Paris
  # Niveaux des quêtes du jour, dans l'ordre (3 au plus) : easy, normal, hard.
  daily: [easy, normal, hard]
  # Une quête bonus, mieux payée, une fois les quêtes du jour faites : son niveau et son bonus.
  bonus-quest: true
  bonus-tier: normal
  bonus-multiplier: 1.3
  # Changer une quête pas encore faite contre une autre du même niveau, une fois par jour :
  # prix (0 = gratuit, -1 = désactivé).
  reroll-cost: 150
  # Changer de métier (le premier choix est gratuit) : prix, et délai entre deux changements.
  change-cost: 2000
  change-cooldown-days: 7
  # Métiers : identifiant -> icône. Nom et description dans lang/ (job.name.<métier>,
  # job.join.description.<métier>). Un nouveau métier commence sans quête : remplis son
  # répertoire dans l'éditeur (Maj + clic droit sur son PNJ, bouton « Répertoire des quêtes »).
  list:
    mineur: IRON_PICKAXE
    bucheron: IRON_AXE
    fermier: IRON_HOE
    chasseur: IRON_SWORD
    pecheur: FISHING_ROD

# Hôtel des ventes (PNJ créé avec /market create <pnj> auction) : entre joueurs, commun à tout le réseau,
# sans lien avec le stock commun. Les invendus et les achats sans place vont dans la boîte de récupération.
auction:
  # Durée d'une annonce, en heures.
  duration-hours: 48
  # Frais de mise en vente, payés d'avance et non remboursés (0.01 = 1 %, 1 Helok au minimum).
  listing-fee: 0.01
  # Taxe retenue sur le prix de vente (0.05 = 5 %) : le vendeur reçoit le reste.
  tax: 0.05
  # Prix minimum et maximum d'une annonce (bloque les transferts déguisés à 1 Helok).
  min-price: 1
  max-price: 1000000
  # Annonces en même temps par joueur ; plus avec la permission etermarket.auction.listings.<n>.
  default-listings: 5

# Menus : bouton en bas du menu. Avec une commande (sans le /), il la lance pour le joueur et relie
# les menus entre eux (ex : "profile" pour revenir au menu du profil) ; vide, il ferme le menu.
menus:
  shop:
    back-command: ""
  jobs:
    back-command: ""
  auction:
    back-command: ""
